config:
  class: sun-arc-card
  style:
    --f7-card-bg-color: transparent
    background: transparent
    padding: 0
  stylesheet: >
    .sun-arc-card {
      background: linear-gradient(180deg, #1a3a5c 0%, #2d6a8a 40%, #c8956a 80%, #8b4a2a 100%);
      border-radius: 18px;
      overflow: hidden;
      margin: 6px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: white;
    }

    .sun-arc-card .arc-header {
      padding: 14px 16px 4px 16px;
      font-size: 0.75em;
      font-weight: 600;
      color: rgba(255,255,255,0.75);
      letter-spacing: 0.04em;
    }

    .sun-arc-card .arc-canvas-wrap {
      position: relative;
      width: 100%;
      padding: 0 0 8px 0;
    }

    .sun-arc-card .arc-canvas-wrap svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .sun-arc-card .arc-divider {
      height: 1px;
      background: rgba(255,255,255,0.15);
      margin: 0 14px;
    }

    .sun-arc-card .arc-stats {
      padding: 10px 16px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .sun-arc-card .arc-stat-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid rgba(255,255,255,0.10);
    }

    .sun-arc-card .arc-stat-row:last-child {
      border-bottom: none;
    }

    .sun-arc-card .arc-stat-left {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
    }

    .sun-arc-card .arc-stat-icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1em;
    }

    .sun-arc-card .arc-stat-label {
      font-size: 0.88em;
      color: rgba(255,255,255,0.85);
      font-weight: 400;
    }

    .sun-arc-card .arc-stat-value {
      font-size: 0.88em;
      color: white;
      font-weight: 500;
    }
