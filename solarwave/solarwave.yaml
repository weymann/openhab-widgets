uid: SunArcWidget
tags: []
props:
  parameters:
    - context: item
      description: Sunrise time in minutes since midnight (e.g. 441 for 07:21)
      label: Sunrise Item (minutes)
      name: sunriseItem
      required: true
      type: INTEGER
    - context: item
      description: Sunset time in minutes since midnight (e.g. 1077 for 17:57)
      label: Sunset Item (minutes)
      name: sunsetItem
      required: true
      type: INTEGER
    - context: item
      description: Solar noon in minutes since midnight (e.g. 759 for 12:39)
      label: Solar Noon Item (minutes)
      name: solarNoonItem
      required: false
      type: INTEGER
    - context: item
      description: Total daylight duration as string (e.g. "10 hrs, 36 min")
      label: Total Daylight Item
      name: totalDaylightItem
      required: false
      type: TEXT
  parameterGroups: []
